<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'nonce-{{nonce}}';">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--vscode-editor-background, #1e1e1e);
    color: var(--vscode-editor-foreground, #d4d4d4);
    font-family: var(--vscode-editor-font-family, 'Menlo', 'Consolas', 'Courier New', monospace);
    font-size: var(--vscode-editor-font-size, 13px);
    overflow: hidden;
  }
  #toolbar {
    flex: none; display: flex; flex-direction: column;
    padding: 3px 8px; border-bottom: 1px solid var(--vscode-panel-border, #3f3f3f);
    font-size: 12px; color: var(--vscode-descriptionForeground, #9d9d9d);
    background: var(--vscode-editor-background, #1e1e1e); user-select: none;
  }
  .tb-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #tb-row2 { border-top: 1px solid var(--vscode-panel-border, #3f3f3f); margin-top: 3px; padding-top: 3px; }
  .tb-sep { flex: none; width: 1px; height: 14px; background: var(--vscode-panel-border, #3f3f3f); }
  #kpython {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    color: var(--vscode-editor-foreground, #d4d4d4);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .st-off { background: #888888; }
  .st-connecting { background: #dcdcaa; }
  .st-busy { background: #d7ba7d; }
  .st-ready { background: #7cb342; }
  .st-err { background: #f48771; }
  #kstatus { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .tb-title { flex: none; font-weight: 600; }
  .tb-spacer { flex: 1; }
  button {
    background: var(--vscode-button-secondaryBackground, #3a3d41);
    color: var(--vscode-button-secondaryForeground, #ffffff);
    border: 1px solid transparent; padding: 2px 10px; cursor: pointer;
    font-size: 12px; font-family: inherit;
  }
  #cwd {
    flex: 1 1 auto; min-width: 60px;
    background: var(--vscode-input-background, #1f1f1f);
    color: var(--vscode-input-foreground, #d4d4d4);
    border: 1px solid var(--vscode-input-border, #3f3f3f);
    padding: 1px 6px; font: inherit; font-size: 12px; outline: none;
  }
  #cwd:focus { border-color: var(--vscode-focusBorder, #007fd4); }
  .tb-label { flex: none; color: var(--vscode-descriptionForeground, #9d9d9d); }
  #btn-pick { padding: 2px 7px; }
  #runmode {
    flex: none;
    background: var(--vscode-input-background, #1f1f1f);
    color: var(--vscode-input-foreground, #d4d4d4);
    border: 1px solid var(--vscode-input-border, #3f3f3f);
    padding: 1px 4px; font: inherit; font-size: 12px; outline: none;
  }
  #runmode:focus { border-color: var(--vscode-focusBorder, #007fd4); }
  button:hover { background: var(--vscode-button-secondaryHoverBackground, #45494e); }
  #output { flex: 1 1 auto; overflow-y: auto; padding: 4px 0 0; line-height: 1.45; }
  .block { margin: 0; }
  .exec { padding: 5px 8px 0 8px; white-space: pre-wrap; word-break: break-word; }
  /* 代码回显块与执行输出分层：输出前加细分隔线，避免输出紧贴代码末行 */
  .block > .exec + .out {
    margin-top: 1.45em;   /* 虚线距上方代码约一个空行 */
    padding-top: 4px;
    border-top: 1px dashed color-mix(in srgb, var(--console-fg, #000000) 22%, transparent);
  }
  .prompt { font-weight: 600; }
  .prompt-in { color: #4ec9b0; }
  .prompt-out { color: #569cd6; }
  .code { color: var(--vscode-editor-foreground, #d4d4d4); }
  .out { padding: 0 8px 8px 8px; }
  .stream { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
  .stream-stdout { color: var(--vscode-editor-foreground, #d4d4d4); }
  .stream-stderr { color: #f48771; }
  .outval { margin: 2px 0 0 0; white-space: pre-wrap; word-break: break-word; }
  .imgout { margin-top: 6px; }
  .imgout img { max-width: 100%; height: auto; display: block; }
  .banner {
    margin: 4px 8px 0 8px; color: var(--vscode-descriptionForeground, #9d9d9d);
    font: inherit; white-space: pre-wrap; word-break: break-word;
  }
  .banner-err { color: #f48771; }
  .trunc { color: var(--vscode-descriptionForeground, #9d9d9d); font-style: italic; }
  #inputbar {
    flex: none; position: relative; display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 8px; border-top: 1px solid var(--vscode-panel-border, #3f3f3f);
    background: var(--vscode-input-background, #1f1f1f);
  }
  #prompt { flex: none; font-weight: 600; color: #4ec9b0; line-height: 1.5; user-select: none; }
  #input {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--vscode-input-foreground, #d4d4d4);
    font: inherit; line-height: 1.5; min-height: 2em; max-height: 220px; padding: 0 0 2px 0;
  }
  #input::placeholder { color: var(--vscode-input-placeholderForeground, #6f6f6f); }
  #completions {
    position: absolute; left: 8px; right: 8px; bottom: calc(100% + 2px);
    max-height: 220px; overflow-y: auto; display: none; z-index: 10;
    background: var(--vscode-editorWidget-background, #252526);
    border: 1px solid var(--vscode-editorWidget-border, #3f3f3f);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    font-size: 12px;
  }
  .ci { padding: 2px 8px; cursor: pointer; white-space: pre; }
  .ci.sel { background: var(--vscode-list-hoverBackground, #2a2d2e); }
  /* ---- 输出区配色（默认白底 qtconsole 风格，可用 ipythonConsole.output* 配置）---- */
  #output { background: var(--console-bg, #ffffff); color: var(--console-fg, #000000); }
  #output .code { color: var(--console-fg, #000000); }
  #output .prompt-in { color: var(--console-prompt-in, #0a7a4f); }
  #output .prompt-out { color: var(--console-prompt-out, #0a47a0); }
  #output .stream-stdout { color: var(--console-fg, #000000); }
  #output .stream-stderr { color: var(--console-stderr, #a1260d); }
  #output .outval { color: var(--console-fg, #000000); }
  #output .banner { color: var(--console-muted, #606060); }
  #output .banner-err { color: var(--console-stderr, #a1260d); }
  #output .trunc { color: var(--console-muted, #888888); }
</style>
</head>
<body>
  <div id="toolbar">
    <div class="tb-row">
      <span class="dot st-off" id="dot"></span>
      <span id="kstatus">未连接</span>
      <span class="tb-title">IPython Console</span>
      <span class="tb-spacer"></span>
      <button id="btn-restart" title="重启内核">重启内核</button>
      <button id="btn-clear" title="清屏（Ctrl+L 同效）">清屏</button>
      <button id="btn-quit" title="关闭控制台并终止内核进程（弹确认）">退出</button>
    </div>
    <div class="tb-row" id="tb-row2">
      <span class="tb-label" title="IPython 内核运行目录（工作目录）">目录</span>
      <input id="cwd" spellcheck="false" placeholder="自动跟随 VS Code 当前文件夹" title="IPython 运行目录。留空 = 跟随 VS Code 当前文件夹（或设置项 workingDir）。回车或点「应用」生效并重启内核">
      <button id="btn-pick" title="浏览选择运行目录">…</button>
      <button id="btn-cwd" title="应用运行目录并重启内核">应用</button>
      <span class="tb-sep"></span>
      <span class="tb-label" title="播放键（运行当前文件）的执行模式">运行</span>
      <select id="runmode" title="播放键执行模式：接着跑 = 保留变量与 import 缓存直接注入；从头跑 = 播放前重启内核，重置所有变量并重新加载 import">
        <option value="append">接着跑</option>
        <option value="fresh">从头跑</option>
      </select>
      <span class="tb-sep"></span>
      <span class="tb-label" title="当前内核解释器（ipythonConsole.pythonPath 解析结果）">Python</span>
      <span id="kpython" title=""></span>

  </div>
  <div id="output">
    <div id="inputbar">
      <span id="prompt">In [*]:</span>
      <textarea id="input" rows="1" spellcheck="false" placeholder="回车执行 · Tab/自动补全 · ↑↓历史 · 无选区Ctrl+C中断 · Shift+Enter 换行 · Ctrl+L 清屏"></textarea>
      <div id="completions"></div>
    </div>
  </div>

<script id="pure" nonce="{{nonce}}">
/* ---- 纯函数：可被 node 直接提取测试 ---- */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var ANSI_COLORS = {
  '30': '#000000', '31': '#a1260d', '32': '#0a7a3f', '33': '#9c6d00',
  '34': '#0a47a0', '35': '#8b2fc9', '36': '#0a7a7a', '37': '#303030',
  '90': '#6f6f6f', '91': '#e2483d', '92': '#35a35c', '93': '#c09a2e',
  '94': '#4f81c1', '95': '#a253c9', '96': '#2fb2b2', '97': '#000000'
};

function ansiToHtml(text) {
  var parts = [];
  var seg = '';
  var style = null;
  var bold = false;
  function flush() {
    if (seg === '') return;
    var st = '';
    if (bold) st += 'font-weight:600;';
    if (style) st += 'color:' + style + ';';
    parts.push(st ? '<span style="' + st + '">' + esc(seg) + '</span>' : esc(seg));
    seg = '';
  }
  var i = 0;
  while (i < text.length) {
    var ch = text.charAt(i);
    if (ch === '\x1b' && text.charAt(i + 1) === '[') {
      var j = text.indexOf('m', i + 2);
      if (j === -1) { seg += text.slice(i); break; }
      var codes = text.slice(i + 2, j).split(';');
      var newStyle = style, newBold = bold;
      for (var k = 0; k < codes.length; k++) {
        var c = codes[k];
        if (c === '0') { newStyle = null; newBold = false; }
        else if (c === '1') { newBold = true; }
        else if (ANSI_COLORS.hasOwnProperty(c)) { newStyle = ANSI_COLORS[c]; }
      }
      if (newStyle !== style || newBold !== bold) {
        flush();
        style = newStyle;
        bold = newBold;
      }
      i = j + 1;
    } else {
      seg += ch;
      i++;
    }
  }
  flush();
  return parts.join('');
}
</script>

<script nonce="{{nonce}}">
(function () {
  'use strict';

  // 任何运行时错误直接显示到输出区（防“按钮静默失效”谜案）
  window.addEventListener('error', function (e) {
    var out = document.getElementById('output');
    if (out) {
      var b = document.createElement('div');
      b.innerHTML = '<pre class="banner banner-err">[前端错误] ' + esc((e && e.message) || 'unknown error') + '</pre>';
      out.appendChild(b);
    }
  });

  var vscodeApi = acquireVsCodeApi();

  var output = document.getElementById('output');
  var inputbar = document.getElementById('inputbar');
  var inputEl = document.getElementById('input');
  var promptEl = document.getElementById('prompt');
  var dotEl = document.getElementById('dot');
  var statusEl = document.getElementById('kstatus');
  var compEl = document.getElementById('completions');
  var btnRestart = document.getElementById('btn-restart');
  var btnClear = document.getElementById('btn-clear');
  var btnQuit = document.getElementById('btn-quit');
  var cwdInput = document.getElementById('cwd');
  var btnPick = document.getElementById('btn-pick');
  var btnCwd = document.getElementById('btn-cwd');
  var cwdEdited = false;    // 用户改过目录输入（hello 不再覆盖）
  var runmodeEl = document.getElementById('runmode');
  var kpythonEl = document.getElementById('kpython');

  var BLOCK_CAP = 300;
  var PRE_CHAR_CAP = 150000;
  var blocks = new Map();   // reqId -> block element
  var nextIn = 1;           // 本地估算的 In 序号（未收到 exec_input 前用）
  var kernelBusy = false;
  var kernelReadyWeb = false;   // 收到 hello 后置 true

  // ---- 输入历史（qtconsole 语义）----
  var hist = [];
  var histIdx = 0;      // 0..hist.length；hist.length 表示草稿位置
  var histDraft = '';

  // ---- 自动补全 ----
  var completionTimer = null;
  var completionData = null;   // {start, end, matches, sel}
  function setStatus(cls, text) {
    dotEl.className = 'dot st-' + cls;
    statusEl.textContent = text;
  }

  // 距底部 120px 内视为"近底跟随"；bottomNear() 必须在 DOM 插入前取快照，
  // 否则插入大段输出后 scrollHeight 已变大，比较失真导致该滚不滚。
  function bottomNear() {
    var el = output;
    return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  }
  function maybeScroll(wasNearBottom) {
    if (wasNearBottom === undefined) wasNearBottom = bottomNear();
    if (wasNearBottom) output.scrollTop = output.scrollHeight;
  }
  function scrollBottom() {
    output.scrollTop = output.scrollHeight;
  }

  function trimNode(container) {
    while (container.children.length > BLOCK_CAP) {
      container.removeChild(container.firstChild);
    }
  }

  function addBanner(text, cls) {
    var near = bottomNear();
    var block = document.createElement('div');
    block.className = 'block';
    block.innerHTML = '<pre class="banner' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</pre>';
    output.insertBefore(block, inputbar);
    trimNode(output);
    maybeScroll(near);
    return block;
  }

  function blockFor(req) {
    if (!blocks.has(req)) {
      var near = bottomNear();
      var el = document.createElement('div');
      el.className = 'block';
      var out = document.createElement('div');
      out.className = 'out';
      el.appendChild(out);
      output.insertBefore(el, inputbar);
      trimNode(output);
      blocks.set(req, el);
      maybeScroll(near);
    }
    return blocks.get(req);
  }

  function execEl(el, count, code) {
    var near = bottomNear();
    var d = document.createElement('div');
    d.className = 'exec';
    d.innerHTML = '<span class="prompt prompt-in">In [' + count + ']:</span> <span class="code">' + esc(code) + '</span>';
    el.insertBefore(d, el.firstChild);
    maybeScroll(near);
  }

  function getStream(el, cls) {
    var out = el.querySelector('.out');
    var pre = out.lastElementChild;
    if (pre && pre.classList.contains('stream-' + cls)) return pre;
    var np = document.createElement('pre');
    np.className = 'stream stream-' + cls;
    out.appendChild(np);
    return np;
  }

  function appendStream(el, text, cls) {
    var near = bottomNear();
    var pre = getStream(el, cls);
    pre.insertAdjacentHTML('beforeend', ansiToHtml(text));
    if (pre.textContent.length > PRE_CHAR_CAP) {
      pre.textContent = pre.textContent.slice(-(PRE_CHAR_CAP * 0.6));
      pre.insertAdjacentHTML('afterbegin', '<span class="trunc">[较早输出已截断…]</span>');
    }
    maybeScroll(near);
  }

  function addOutValue(el, count, text) {
    var near = bottomNear();
    var d = document.createElement('pre');
    d.className = 'outval';
    // 多行输出（DataFrame 等）冒号后换行，列名从下一行起，与 IPython 原版一致
    var sep = text.indexOf('\n') >= 0 ? '\n' : ' ';
    d.innerHTML = '<span class="prompt prompt-out">Out[' + count + ']:</span>' + sep + esc(text);
    el.querySelector('.out').appendChild(d);
    maybeScroll(near);
  }

  function addDisplayImg(el, b64) {
    var near = bottomNear();
    var d = document.createElement('div');
    d.className = 'imgout';
    d.innerHTML = '<img src="data:image/png;base64,' + b64 + '">';
    el.querySelector('.out').appendChild(d);
    maybeScroll(near);
  }

  function displayPlain(el, text) {
    var near = bottomNear();
    var d = document.createElement('pre');
    d.className = 'outval';
    d.textContent = text;
    el.querySelector('.out').appendChild(d);
    maybeScroll(near);
  }

  /* ---- 自动补全 ---- */
  function completionVisible() {
    return completionData !== null && compEl.style.display !== 'none';
  }

  function completionHide() {
    completionData = null;
    compEl.style.display = 'none';
    compEl.innerHTML = '';
  }

  function completionRender() {
    var items = compEl.children;
    for (var i = 0; i < items.length; i++) {
      items[i].className = 'ci' + (i === completionData.sel ? ' sel' : '');
    }
    var sel = items[completionData.sel];
    if (sel && sel.scrollIntoView) {
      sel.scrollIntoView({ block: 'nearest' });
    }
  }

  function completionShow(start, end, matches) {
    if (!matches.length) { completionHide(); return; }
    completionData = { start: start, end: end, matches: matches.slice(0, 80), sel: 0 };
    compEl.innerHTML = '';
    for (var i = 0; i < completionData.matches.length; i++) {
      (function (idx) {
        var d = document.createElement('div');
        d.className = 'ci' + (idx === 0 ? ' sel' : '');
        d.textContent = completionData.matches[idx];
        d.addEventListener('mousedown', function (ev) {
          ev.preventDefault();          // 保持输入框焦点
          completionData.sel = idx;
          completionAccept();
        });
        compEl.appendChild(d);
      })(i);
    }
    completionRender();
    compEl.style.display = 'block';
  }

  function completionMove(dir) {
    if (!completionVisible()) return;
    var n = completionData.matches.length;
    completionData.sel = (completionData.sel + dir + n) % n;
    completionRender();
  }

  function completionAccept() {
    if (!completionVisible()) return;
    var m = completionData.matches[completionData.sel];
    if (m === undefined) { completionHide(); return; }
    var code = inputEl.value;
    inputEl.value = code.slice(0, completionData.start) + m + code.slice(completionData.end);
    var cp = completionData.start + m.length;
    inputEl.setSelectionRange(cp, cp);
    completionHide();
    autosize();
  }

  function shouldComplete(code, pos) {
    return /[A-Za-z0-9_.\[\]'"@\s]$/.test(code.slice(0, pos));
  }

  function scheduleCompletion() {
    if (kernelBusy) { completionHide(); return; }
    if (completionTimer) clearTimeout(completionTimer);
    completionTimer = setTimeout(requestCompletion, 180);
  }

  function requestCompletion() {
    if (kernelBusy) { completionHide(); return; }
    if (completionTimer) { clearTimeout(completionTimer); completionTimer = null; }
    var code = inputEl.value;
    var pos = inputEl.selectionStart;
    if (!shouldComplete(code, pos)) { completionHide(); return; }
    vscodeApi.postMessage({ type: 'complete', code: code, cursorPos: pos });
  }

  /* ---- 历史 ---- */
  function historyMove(dir) {
    if (hist.length === 0) return;
    if (histIdx === hist.length && dir < 0) {
      histDraft = inputEl.value;        // 首次上溯时保存当前草稿
    }
    var next = histIdx + dir;
    if (next < 0) next = 0;
    if (next > hist.length) next = hist.length;
    histIdx = next;
    if (histIdx === hist.length) {
      inputEl.value = histDraft;
    } else {
      inputEl.value = hist[histIdx];
    }
    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    autosize();
    completionHide();
  }

  /* ---- 内核事件 ---- */
  function handleKernel(ev) {
    switch (ev.t) {
      case 'status':
        setStatus('connecting', ev.text || '连接中…');
        break;
      case 'hello':
        if (connTimer) { clearTimeout(connTimer); connTimer = null; }
        kernelReadyWeb = true;
        kernelBusy = false;
        nextIn = 1;
        promptEl.textContent = 'In [' + nextIn + ']:';
        if (!cwdEdited) cwdInput.value = ev.cwd || '';
        kpythonEl.textContent = ev.python_path || '';
        kpythonEl.title = ev.python_path || '';
        addBanner('Python ' + ev.python + ' | IPython kernel (ipykernel ' + ev.ipykernel + ')\n运行目录：' + (ev.cwd || '?') + '\n↑↓ 历史 · Tab/实时联想补全 · 无选区时 Ctrl+C 中断执行\n');
        break;
      case 'runMode':
        if (ev.mode === 'fresh') runmodeEl.value = 'fresh';
        else runmodeEl.value = 'append';
        break;
      case 'colors':
        document.documentElement.style.setProperty('--console-bg', ev.background || '#ffffff');
        document.documentElement.style.setProperty('--console-fg', ev.foreground || '#000000');
        document.documentElement.style.setProperty('--console-prompt-in', ev.promptIn || '#0a7a4f');
        document.documentElement.style.setProperty('--console-prompt-out', ev.promptOut || '#0a47a0');
        document.documentElement.style.setProperty('--console-stderr', ev.stderr || '#a1260d');
        document.documentElement.style.setProperty('--console-muted', ev.muted || '#606060');
        break;
      case 'cwd_picked':
        cwdInput.value = ev.cwd || '';
        cwdEdited = true;
        cwdInput.focus();
        cwdInput.select();
        break;
      case 'launch_error':
        setStatus('err', '启动失败');
        addBanner('内核启动失败：\n' + (ev.text || '') + '\n请检查设置 ipythonConsole.pythonPath 指向含 ipykernel 的解释器\n', 'banner-err');
        break;
      case 'boot':
        addBanner('（启动中）' + (ev.text || '') + '\n');
        break;
      case 'host_stderr':
        addBanner('（内核日志）' + (ev.text || '') + '\n');
        break;
      case 'busy':
        kernelBusy = true;
        setStatus('busy', '运行中');
        completionHide();
        nextIn++;
        promptEl.textContent = 'In [' + nextIn + ']:';
        scrollBottom();   // 新任务开始：强制跳到底部看最新执行
        break;
      case 'idle':
        kernelBusy = false;
        setStatus('ready', '就绪');
        maybeScroll();   // 运行结束：近底才跟随，用户上翻读输出时不打扰
        break;
      case 'exec_input':
        nextIn = ev.count + 1;
        promptEl.textContent = 'In [' + nextIn + ']:';
        execEl(blockFor(ev.i), ev.count, ev.code);
        break;
      case 'stream':
        appendStream(blockFor(ev.i), ev.text, ev.name === 'stderr' ? 'stderr' : 'stdout');
        break;
      case 'result':
        addOutValue(blockFor(ev.i), ev.count, ev.text);
        break;
      case 'display':
        if (ev.mime === 'image/png') addDisplayImg(blockFor(ev.i), ev.data);
        else displayPlain(blockFor(ev.i), ev.data);
        break;
      case 'error':
        appendStream(blockFor(ev.i), (ev.trace || ev.evalue || '') + '\n', 'stderr');
        break;
      case 'interrupted':
        appendStream(blockFor(ev.i), 'KeyboardInterrupt\n', 'stderr');
        break;
      case 'notice':
        if (ev.i !== undefined && ev.i !== null) appendStream(blockFor(ev.i), ev.text + '\n', 'stdout');
        else addBanner((ev.text || '') + '\n');
        break;
      case 'input':
        appendStream(blockFor(ev.i), '（内核请求 input()：' + ev.prompt + '—— 自动回空，避免挂起）\n', 'stderr');
        break;
      case 'complete':
        completionShow(ev.start, ev.end, ev.matches || []);
        break;
      default:
        break;
    }
  }

  window.addEventListener('message', function (m) {
    var msg = m.data;
    if (msg && msg.type === 'kernel') handleKernel(msg);
  });

  /* ---- 输入 ---- */
  function runInput() {
    var code = inputEl.value;
    if (!code.trim()) return;
    if (hist[hist.length - 1] !== code) hist.push(code);
    histIdx = hist.length;
    vscodeApi.postMessage({ type: 'execute', code: code });
    inputEl.value = '';
    autosize();
    completionHide();
  }

  function clearScreen() {
    output.innerHTML = '';
    output.appendChild(inputbar);
    blocks.clear();
    addBanner('已清屏（In 序号保留，与 qtconsole %clear 一致）· Ctrl+L 同效\n');
  }

  function autosize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 220) + 'px';
  }

  inputEl.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (completionVisible()) completionMove(-1);
      else historyMove(-1);
      return;
    }
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (completionVisible()) completionMove(1);
      else historyMove(1);
      return;
    }
    if (ev.key === 'Tab') {
      ev.preventDefault();
      if (completionVisible()) completionAccept();
      else requestCompletion();
      return;
    }
    if (ev.key === 'Escape') {
      completionHide();
      return;
    }
    if (ev.key === 'c' && ev.ctrlKey) {
      // qtconsole 语义：有选区时 Ctrl+C=复制（不拦截）；无选区时=中断
      if (inputEl.selectionStart !== inputEl.selectionEnd) return;
      ev.preventDefault();
      vscodeApi.postMessage({ type: 'interrupt' });
      return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      runInput();
      return;
    }
    if (ev.key === 'l' && ev.ctrlKey) {
      ev.preventDefault();
      clearScreen();
    }
  });
  inputEl.addEventListener('input', function () {
    autosize();
    scheduleCompletion();
  });
  inputEl.addEventListener('blur', function () {
    setTimeout(completionHide, 150);
  });
  btnRestart.addEventListener('click', function () {
    blocks.clear();
    hist = [];
    histIdx = 0;
    vscodeApi.postMessage({ type: 'restart' });
  });
  btnQuit.addEventListener('click', function () {
    vscodeApi.postMessage({ type: 'quit' });
  });
  btnClear.addEventListener('click', clearScreen);
  function applyCwd() {
    var v = cwdInput.value.trim();
    if (v === '') {
      cwdEdited = false;    // 恢复默认：等 hello 回填实际目录
    } else {
      cwdEdited = true;
    }
    vscodeApi.postMessage({ type: 'cwd', cwd: v });
  }
  cwdInput.addEventListener('input', function () { cwdEdited = true; });
  cwdInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); applyCwd(); }
  });
  btnCwd.addEventListener('click', applyCwd);
  btnPick.addEventListener('click', function () {
    vscodeApi.postMessage({ type: 'pickCwd' });
  });
  runmodeEl.addEventListener('change', function () {
    vscodeApi.postMessage({ type: 'runMode', mode: runmodeEl.value });
  });

  var connTimer = setTimeout(function () {
    addBanner('25 秒未收到内核响应。\n若按钮也无反应，此面板可能未被扩展接管（僵尸面板）：请点标签栏 × 关闭本面板，\n然后按 Ctrl+Alt+O 重新打开即可恢复。\n', 'banner-err');
  }, 25000);
  addBanner('IPython Console · 前端 v1.3.2 · 正在连接 IPython kernel…');
  // 扩展未激活时首次 connect 会丢失（窗口恢复场景），每 5 秒自动重发直到 hello
  function ensureConnect() {
    vscodeApi.postMessage({ type: 'connect' });
    if (!kernelReadyWeb) setTimeout(ensureConnect, 5000);
  }
  ensureConnect();
})();
</script>
</body>
</html>
